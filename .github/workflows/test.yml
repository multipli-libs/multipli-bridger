name: test

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]

# Least privilege: the CI job only needs to read the repository.
permissions:
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      # Fork-based scripts/tests in this repository rely on authenticated RPC
      # endpoints; the public rpc.ankr.com endpoints reject unauthenticated
      # requests, so fork tests are skipped unless a secret endpoint is
      # configured for the run.
      - name: Run Forge tests (non-fork)
        run: |
          forge test -vvv --nmt "test/unit/scripts"
